<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="นโยบายโมเมนตัม — 12 นโยบายที่เราจะทำเพื่อนักเรียนทุกคน">
  <title>นโยบาย | Momentum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;900&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/policy.css">
</head>
<body class="policy-page">

  <header class="navbar" role="banner">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand" aria-label="Momentum home">
        <img src="image/icons and logos/logo.png" alt="Momentum logo" width="40" height="40">
        Momentum
      </a>

      <nav aria-label="Main navigation">
        <ul class="navbar__links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="members.html">Members</a></li>
          <li><a href="policy.html" class="is-active">Policy</a></li>
          <li><a href="index.html#connect">Connect</a></li>
        </ul>
      </nav>

      <div class="navbar__social" aria-label="Social media">
        <a href="https://www.instagram.com/mmt.skw?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
          <img src="image/icons and logos/instagram-hover.png" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com/@momentum03.skw?is_from_webapp=1&sender_device=pc" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="Follow us on TikTok">
          <img src="image/icons and logos/tik-tok-hover.png" alt="TikTok">
        </a>
      </div>

      <button class="navbar__toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="policy-hero">
      <p class="policy-hero__eyebrow">สิ่งที่เราจะทำเพื่อคุณ</p>
      <h1 class="policy-hero__title">
        <span class="policy-hero__title-line">นโยบาย</span>
        <span class="policy-hero__title-line">โมเมนตัม</span>
      </h1>
      <p class="policy-hero__subtitle">แผนดำเนินการของเรา | นำโดยภารกิจ ปณิธาน และผู้คน</p>
    </section>

    <section class="policy-grid-section" aria-label="นโยบายทั้งหมด">
      <div class="policy-grid" id="policy-grid"></div>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <div class="footer__brand">
        <img src="image/icons and logos/logo.png" alt="">
        Momentum
      </div>
      <p class="footer__copy">&copy; 2026 Momentum Political Party. All rights reserved.</p>
      <div class="footer__socials" aria-label="Social media">
        <a href="https://www.instagram.com/mmt.skw?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <img src="image/icons and logos/instagram-hover.png" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com/@momentum03.skw?is_from_webapp=1&sender_device=pc" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
          <img src="image/icons and logos/tik-tok-hover.png" alt="TikTok">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/policy.js"></script>
  <script>
    const toggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');

    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      navLinks.classList.toggle('is-open');
    });

    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        toggle.setAttribute('aria-expanded', 'false');
        navLinks.classList.remove('is-open');
      });
    });
  </script>
</body>
</html>
